llm:
  provider: ${LLM_PROVIDER:groq}

  gemini:
    api-key: ${GOOGLE_API_KEY:not-set}
    model: gemini-2.0-flash
    max-tokens: 256
    max-retries: 3
    retry-delay-ms: 60000

  anthropic:
    api-key: ${ANTHROPIC_API_KEY:not-set}
    model: claude-opus-4-5
    max-tokens: 1024
    max-retries: 5
    retry-delay-ms: 2000

  groq:
    api-key: ${GROQ_API_KEY:not-set}
    model: llama-3.3-70b-versatile
    max-tokens: 1024
    max-retries: 3
    retry-delay-ms: 2000

processing:
  input-dir: C:\Users\ASUS\Downloads\sapiensu_take_home_dataset\Sapiensu\pdfs
  output-dir: C:\Users\ASUS\Downloads\sapiensu_take_home_dataset\Sapiensu\output
  output-filename: results.json
  concurrency: 1
  text-truncation-chars: 4000

logging:
  level:
    com.sapiensu.sebi: INFO
